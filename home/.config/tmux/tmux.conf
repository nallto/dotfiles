# ~/.config/tmux/tmux.conf — tmux 3.1+ reads this XDG path on its own, so no
# TMUX_CONF / -f wiring is needed (mac = brew 3.5+, Ubuntu 22.04 = 3.2a, 24.04 = 3.4).
# Placed by dotman (single-mirror: home/.config/tmux/ -> ~/.config/tmux/).
# Inspect the live values with `tmux show-options -g` / `tmux show-options -gw`.
#
# prefix stays the default C-b on purpose: C-a would fight zsh's emacs binding
# (beginning-of-line), and C-j / C-r are already zoxide / fzf in .zshrc.

# --- Terminal: 256 colors + truecolor passthrough --------------------------
# tmux-256color carries italics/undercurl; it ships in macOS's terminfo db and
# in Debian/Ubuntu's ncurses-base. If a machine's terminfo lacks the entry, fall
# back to "screen-256color" here.
# The override matches on the OUTER terminal's TERM, so it covers *256col* ones
# (WSL2 / ssh with xterm-256color). Ghostty is TERM=xterm-ghostty and advertises
# Tc/setrgbf in its own terminfo, so tmux detects truecolor there by itself.
# Written as terminal-overrides (3.1+) rather than terminal-features (3.2+) so
# the same file stays valid on the oldest tmux we ship.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# --- Behavior --------------------------------------------------------------
set -g mouse on              # wheel scroll + click to select/resize panes
set -g history-limit 100000  # scrollback lines per pane
set -sg escape-time 0        # no Esc wait, so vim in a pane feels native
set -g focus-events on       # forward focus in/out to apps (vim autoread)

# --- Indexing: 1-based (matches the keyboard), no gaps after closing -------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Splits / new windows: | and -, inheriting the current directory -------
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Copy mode: vi keys, clipboard over OSC 52 -----------------------------
# set-clipboard on makes tmux emit OSC 52, so a yank reaches the host clipboard
# through Ghostty (macOS) or the terminal bridging into Windows (WSL2) — no
# pbcopy / clip.exe dependency from inside tmux.
set -g set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
